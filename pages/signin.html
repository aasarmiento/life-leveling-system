<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Questify — Sign in</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header>
  <nav>
  <div class="nav-logo">
    <a href="../index.html">QUESTIFY</a>
  </div>
  <div class="nav-links">
    <a href="../index.html">Home</a>
    <a href="about.html">About</a>
    <a href="signin.html" class="nav-signup">Sign In</a>
  </div>
</nav>
</header>

<div class="auth-wrap">
  <form class="auth-card" action="dashboard.html">
    <h1>Welcome back</h1>
    <p class="page-kicker">Log your effort. Watch it turn into XP.</p>
    
    <div class="tabs">
      <a class="on" href="signin.html">Sign in</a>
      <a href="create-account.html">Create account</a>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@email.com" required>
      <div class="err">Enter your email.</div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" required>
      <div class="err">Enter your password.</div>
    </div>

    <div style="margin-top:16px">
      <button class="btn-gold" type="submit" style="width:100%;justify-content:center">Enter Questify</button>
    </div>
  </form>
</div>

<footer>
  <div class="footer-logo">
    <a href="../index.html" style="text-decoration: none; color: inherit;">QUESTIFY</a>
  </div>
  <div class="names">Abigail Ann Sarmiento · Christian Allen Soriano · Jeremiah Alzona · Rowel Jepsani · Sire Manalo</div>
  <div>© 2026 Questify</div>
</footer>

</body>
</html>

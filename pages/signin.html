<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Questify — Sign in</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/nav.js"></script>
</head>
<body>

<nav>
  <div class="nav-logo">
    <a href="../index.html">QUESTIFY</a>
  </div>
  <div class="nav-links">
    <a href="../index.html">Home</a>
    <a href="about.html">About</a>
    <a href="signin.html" class="nav-signup" aria-current="page">Sign In</a>
  </div>
</nav>

<main class="auth-wrap">
  <form class="auth-card" action="dashboard.html">
    <h1>Welcome back</h1>
    <p class="page-kicker">Log your effort. Watch it turn into XP.</p>

    <div class="tabs">
      <a class="on" href="signin.html" aria-current="page">Sign in</a>
      <a href="create-account.html">Create account</a>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@email.com" required>
      <div class="err">Enter your email.</div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" required>
      <div class="err">Enter your password.</div>
    </div>

    <div style="margin-top:16px">
      <button class="btn-gold" type="submit" style="width:100%;justify-content:center">Enter Questify</button>
    </div>
  </form>
</main>

<footer>
  <a class="footer-logo" href="../index.html">QUESTIFY</a>
  <div class="footer-info">
    <p><strong>Web Systems and Technology</strong></p>
    <p>Abigail Ann Sarmiento | Christian Allen Soriano | Jeremiah Alzona | Rowel Jepsani | Sire Manalo</p>
  </div>
  <div>© 2026 Questify</div>
</footer>

</body>
</html>

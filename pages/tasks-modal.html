<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Questify — Add quest</title>
<link rel="stylesheet" href="../css/style.css">
</head><body>
<header><nav>
  <div class="nav-logo"><a href="../index.html" style="text-decoration: none; color: inherit;">QUESTIFY</a></div>
  <div class="nav-links">
    <a href="dashboard.html">Dashboard</a>
    <a class="active" href="tasks.html">Tasks</a>
    <a href="profile.html">Profile</a>
    <a href="about.html">About</a>
    <a class="nav-signup" href="signin.html">Alex</a>
  </div>
</nav></header>
<main>
  <h1 class="pixel">Quest Board</h1>
  <p class="page-kicker">Work, growth, and health — named so they can move.</p>
</main>
<div class="modal-back">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2>Add quest</h2>
      <a href="tasks.html"><img class="icon" src="../00-shared/icon-close.png" alt="close"></a>
    </div>
    <!-- Title -->
    <label for="questTitle">Title</label>
    <input id="questTitle" placeholder="Name the quest">
    <div id="questError" class="err" style="display: none; color: var(--pink); font-size: 12px; margin-top: 4px;">
      Name the quest first.
    </div>

    <!-- Caption -->
    <label for="questCaption">Caption</label>
    <input id="questCaption" placeholder="One short line">

    <!-- Category -->
    <label for="questCategory">Category</label>
    <select id="questCategory">
      <option value="Work">Work</option>
      <option value="Growth">Growth</option>
      <option value="Health">Health</option>
    </select>

    <!-- Priority -->
    <label for="questPriority">Priority</label>
    <select id="questPriority">
      <option value="Low">Low</option>
      <option value="Medium">Medium</option>
      <option value="High" selected>High</option>
    </select>

    <!-- XP -->
    <label for="questXp">XP</label>
    <select id="questXp">
      <option value="10">10</option>
      <option value="20">20</option>
      <option value="30">30</option>
    </select>

    <!-- Due Date -->
    <label for="questDue">Due date</label>
    <div class="date-wrap">
      <input id="questDue" type="date" value="2026-09-12">
      <img src="../assets/icons/00-shared/icon-calendar.png" alt="">
    </div>

    <!-- Action Buttons -->
    <div class="modal-actions" style="display:flex; justify-content:flex-end; gap:8px; margin-top:20px;">
      <a class="btn-ghost" href="tasks.html">Cancel</a>
      <button id="saveQuestBtn" class="btn-lime" type="button">Save quest</button>
    </div>
  </div>
</div>

<script src="../js/app.js"></script>
</body>
</html>
